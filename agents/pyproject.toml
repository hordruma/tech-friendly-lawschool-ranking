[project]
name = "lawschool-ranking-agents"
version = "0.1.0"
description = "Research and scoring agents for the Tech-Friendly Law School Ranking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "tavily-python>=0.3.0",
    "typedb-driver>=2.28.0",
    "pydantic>=2.6.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
researcher = "researcher:main"
scorer = "scorer:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
