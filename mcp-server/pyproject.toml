[project]
name = "lawschool-ranking-mcp"
version = "0.1.0"
description = "MCP server for the Tech-Friendly Law School Ranking — lets AI assistants help students explore and compare schools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv",
    # Required by agents/scorer.py which this server imports at runtime
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
lawschool-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include only the mcp-server package files
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
